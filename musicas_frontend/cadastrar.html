<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Cadastrar música | Minhas Músicas</title>
    <link rel="stylesheet" href="cadastrar.css">
</head>
<body>
    <main class="pagina">
        <header class="cabecalho">
            <a class="voltar" href="index.html">Voltar para a lista</a>
            <h1>Cadastrar música</h1>
        </header>

        <div class="campo">
            <label for="titulo">Título</label>
            <input type="text" id="titulo" name="titulo">
        </div>

        <div class="campo">
            <label for="artista">Artista</label>
            <input type="text" id="artista" name="artista">
        </div>

        <div class="campo">
            <label for="genero">Gênero</label>
            <input type="text" id="genero" name="genero">
        </div>

        <div class="campo">
            <label for="ano">Ano</label>
            <input type="number" id="ano" name="ano">
        </div>

        <div class="campo">
            <label for="duracao">Duração em minutos</label>
            <input type="number" id="duracao" name="duracao">
        </div>

        <button id="botaoCadastrar" type="button">Cadastrar</button>
    </main>

    <script src="cadastrar.js"></script>
</body>
</html>
